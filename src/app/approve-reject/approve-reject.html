<div class="container">
  <h2>Requests Approval Table</h2>
  <table>
    <thead>
      <tr>
        <th>Request ID</th>
        <th>Item</th>
        <th>Requester</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let req of requests">
        <td>{{ req.id }}</td>
        <td>{{ req.item }}</td>
        <td>{{ req.requester }}</td>
        <td [ngClass]="req.status.toLowerCase()">{{ req.status }}</td>
        <td class="actions">
          <button *ngIf="req.status==='Pending'" class="btn approve" (click)="approve(req)">Approve</button>
          <button *ngIf="req.status==='Pending'" class="btn reject" (click)="reject(req)">Reject</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="toast" *ngIf="showToast">
    {{ toastMessage }}
  </div>
</div>
